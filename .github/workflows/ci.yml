name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Automated tests
        run: pnpm test
      - name: Test coverage
        run: pnpm run test:coverage
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL || 'postgresql://ci:ci@127.0.0.1:5432/ci' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-key' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-placeholder-auth-secret-not-for-production' }}
